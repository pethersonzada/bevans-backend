name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bevans_validation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bevans_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Guardar XML da suíte de API simulada
        run: |
          mkdir -p "$RUNNER_TEMP/bevans-api-testes"
          cp target/surefire-reports/TEST-*.xml "$RUNNER_TEMP/bevans-api-testes/"
      - name: Testar integridade do gerador de evidências
        run: python3 -m unittest discover -s scripts/ci -p 'test_gerar_evidencias.py'

      - name: Preparar schemas PostgreSQL isolados
        env:
          PGPASSWORD: local-test-only
        run: |
          for schema in capacity_service publication_service boarding_service catalog_service favorite_service gps_service excursion_service invite_service enrollment_service private_service; do
            psql -h 127.0.0.1 -p 55435 -U postgres -d bevans_validation -v ON_ERROR_STOP=1 -c "CREATE SCHEMA $schema"
          done

      - name: Validar PostgreSQL e migrações
        run: mvn --batch-mode --no-transfer-progress -Ppostgres-validation verify

      - name: Validar privilégios da role da aplicação
        env:
          PGHOST: 127.0.0.1
          PGPORT: "55435"
          PGDATABASE: bevans_validation
          PGUSER: postgres
          PGPASSWORD: local-test-only
        run: bash scripts/test-db-permissions.sh

      - name: Registrar evidências do PostgreSQL descartável
        run: |
          python3 scripts/ci/gerar_evidencias.py \
            --api-dir "$RUNNER_TEMP/bevans-api-testes" \
            --postgres-dir target/surefire-reports \
            --output "$RUNNER_TEMP/bevans-evidencias/resultado.json"

      - name: Anexar apenas o resumo sem dados de usuários
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-backend-postgresql-descartavel
          path: ${{ runner.temp }}/bevans-evidencias/resultado.json
          if-no-files-found: error
          retention-days: 14
