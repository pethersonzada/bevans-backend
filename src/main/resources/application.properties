spring.config.import=optional:file:.env[.properties]

spring.application.name=bevans-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jackson.deserialization.accept-float-as-int=false
spring.jpa.show-sql=false
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
spring.jpa.open-in-view=false

server.port=${PORT:8080}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.packages-to-scan=com.bevans.controller
springdoc.override-with-generic-response=false
